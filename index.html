
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport"/>
<title>Sharingan Services — Empower Your Vision</title>

<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700;800&display=swap" rel="stylesheet"/>

<style>
:root {
  --accent:#e11d48;
  --card:rgba(17,25,40,0.75);
  --text:#e5e7eb;
  --muted:#94a3b8;
  font-family:'Nunito',system-ui;
}

body {
  margin:0;
  background:#0b0f19;
  color:var(--text);
}

/* Sections */
section {
  max-width:1000px;
  margin:80px auto;
  padding:40px 20px;
  background:var(--card);
  border-radius:18px;
  text-align:center;
}

/* Valentine Button */
.valentine-btn {
  display:inline-block;
  padding:16px 42px;
  font-size:18px;
  font-weight:800;
  border-radius:999px;
  text-decoration:none;
  color:#fff;
  background:linear-gradient(90deg,#e11d48,#7f1d1d);
  box-shadow:0 0 22px rgba(225,29,72,0.6);
  transition:all .35s ease;
  animation:pulseGlow 2.5s infinite;
}

.valentine-btn:hover {
  transform:scale(1.08);
  box-shadow:0 0 36px rgba(225,29,72,0.95);
}

@keyframes pulseGlow {
  0% { box-shadow:0 0 18px rgba(225,29,72,.4); }
  50% { box-shadow:0 0 34px rgba(225,29,72,.9); }
  100% { box-shadow:0 0 18px rgba(225,29,72,.4); }
}
</style>
</head>

<body>

<main>

<section>
  <h1>Empower your vision with Sharingan precision.</h1>
  <p style="color:var(--muted)">Modern, fast, and beautiful web experiences.</p>
</section>

<!-- 💘 VALENTINE SECTION -->
<section id="valentine">
  <h2 style="font-size:2.3em;color:var(--accent);">💘 Valentine Special</h2>
  <p style="opacity:.85;max-width:600px;margin:20px auto;">
    Someone special is waiting for you…  
    click below to unlock a little surprise ❤️
  </p>
  <a href="Heartware.html" class="valentine-btn">💖 Be My Valentine</a>
</section>

<section>
  <h2>Services</h2>
  <p style="color:var(--muted)">Design • Frontend • Deployment</p>
</section>

</main>

<footer style="text-align:center;opacity:.6;margin:40px 0;">
  © 2026 Sharingan Services
</footer>

</body>
</html>
