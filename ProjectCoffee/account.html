<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap" rel="stylesheet">

    <title>Account</title>
    <link rel="stylesheet" href="account.css">
</head>

<body>
    <main class="main">
        <form action="submitform" class="form">
            <h1>Login Form</h1>
            <div>
                <label for="email">email address <sup>*</sup></label>
            </div>
            <div>
                <input type="email" .required placeholder="Enter Your Email" id="email" required>
            </div>
            <div>
                <label for="password">password <sup>*</sup></label>
            </div>
            <div>
                <input type="password" .required placeholder="Enter Password" id="password" required minlength="6">
            </div>
            <div>
                <button>sign in</button>
            </div>
            <p>
                Don't have an account yet?<a href="register.html"> Register here.</a>
            <div>
                <a href="recover.html">Forgot Password?</a>
            </div>
            </p>
        </form>
    </main>

<footer>
    <p> &#169; 2026 All Rights Reserved.</p>
    <p>Sam-Chan</p>
</footer>

</body>


</html>
