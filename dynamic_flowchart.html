<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Central Kitchen – Dynamic Flowchart</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=IBM+Plex+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f2ede6;
  --ink: #1c1a17;
  --muted: #8a8278;
  --border: #ccc6bc;
  --shadow: rgba(0,0,0,.07);
  --line: #bfb9af;

  --c0:  #1c1a17; --c0f:  #f2ede6;
  --c1:  #29453b; --c1f:  #dff0e8;
  --c2:  #7a3410; --c2f:  #fff2ea;
  --c3d: #1e2d78; --c3df: #eaedff;
  --c3c: #1e2d78; --c3cf: #eaedff;
  --c3z: #1e2d78; --c3zf: #eaedff;
  --c3x: #1e2d78; --c3xf: #eaedff;
  --c4bg: #e8f0e4; --c4bd: #a8c4a0; --c4f: #2a4a22;
  --c5bg: #fdf3e3; --c5bd: #e0b870; --c5f: #6b4700;
  --c6bg: #fff;    --c6bd: #ccc;    --c6f: #666;

  --add-btn:  #f0a500;
  --del-btn:  #d93a3a;
  --edit-btn: #3a8fd9;

  --font-h: 'Barlow Condensed', sans-serif;
  --font-m: 'IBM Plex Mono', monospace;
  --r: 4px;
  --lw: 2px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-m);
  min-height: 100vh;
  background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' stroke='%23ccc6bc' stroke-width='0.5' opacity='0.4'%3E%3Cpath d='M0 60L60 0M-15 15L15-15M45 75L75 45'/%3E%3C/g%3E%3C/svg%3E");
}

/* ══ TOPBAR ══ */
.topbar {
  background: var(--c0);
  color: var(--c0f);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: .8rem 1.4rem;
  position: sticky; top: 0; z-index: 300;
  gap: .8rem; flex-wrap: wrap;
}
.topbar h1 {
  font-family: var(--font-h);
  font-size: 1.4rem; font-weight: 800;
  letter-spacing: .1em; text-transform: uppercase; white-space: nowrap;
}
.topbar-right { display: flex; gap: .4rem; align-items: center; flex-wrap: wrap; }
.tb-btn {
  background: #2e2c29; border: 1px solid #444; color: #ccc;
  font-family: var(--font-m); font-size: .7rem;
  padding: .35rem .75rem; border-radius: 3px; cursor: pointer;
  transition: background .15s, color .15s; white-space: nowrap;
}
.tb-btn:hover { background: #444; color: #fff; }
.tb-btn.accent { background: var(--add-btn); color: #111; border-color: var(--add-btn); }
.tb-btn.accent:hover { background: #ffc02e; }
.zoom-group { display: flex; gap: .2rem; }
.zoom-group .tb-btn { padding: .35rem .6rem; font-size: .85rem; line-height: 1; }

/* ══ HINTBAR ══ */
.hintbar {
  background: #f7f2e8; border-bottom: 1px solid var(--border);
  padding: .4rem 1.4rem; font-size: .63rem; color: var(--muted);
  letter-spacing: .05em; display: flex; gap: 1.4rem; flex-wrap: wrap;
}
.hint-item { display: flex; align-items: center; gap: .3rem; }
.hint-dot  { width: 7px; height: 7px; border-radius: 50%; }

/* ══ MAIN LAYOUT: legend left + diagram right ══ */
.main-wrap {
  display: flex;
  align-items: flex-start;
  min-height: calc(100vh - 90px);
}

/* ══ LEFT LEGEND PANEL ══ */
.legend-panel {
  position: sticky;
  top: 90px;               /* below topbar+hintbar */
  width: 178px;
  min-width: 178px;
  flex-shrink: 0;
  padding: 1.2rem .8rem 1.2rem 1rem;
  display: flex;
  flex-direction: column;
  gap: 6px;
  border-right: 1px solid var(--border);
  background: #ece7df;
  align-self: flex-start;
  min-height: calc(100vh - 90px);
}
.legend-panel h3 {
  font-family: var(--font-h);
  font-size: .72rem; font-weight: 700;
  letter-spacing: .12em; text-transform: uppercase;
  color: var(--muted); margin-bottom: 4px;
}
.leg-item {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: .62rem;
  color: var(--ink);
  letter-spacing: .04em;
  text-transform: uppercase;
}
/* The square swatch — same height as its corresponding node box */
.leg-swatch {
  flex-shrink: 0;
  border-radius: 3px;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* swatch sizes match node padding+font roughly */
.sw-0 { width: 52px; height: 52px; background: var(--c0); }
.sw-1 { width: 48px; height: 48px; background: var(--c1); }
.sw-2 { width: 44px; height: 44px; background: var(--c2); }
.sw-3d{ width: 40px; height: 40px; background: var(--c3d); }
.sw-3c{ width: 40px; height: 40px; background: var(--c3c); }
.sw-3z{ width: 40px; height: 40px; background: var(--c3z); }
.sw-3x{ width: 40px; height: 40px; background: var(--c3x); }
.sw-4 { width: 38px; height: 38px; background: var(--c4bg); border: 1.5px solid var(--c4bd); }
.sw-5 { width: 36px; height: 36px; background: var(--c5bg); border: 1.5px solid var(--c5bd); }
.sw-6 { width: 34px; height: 34px; background: var(--c6bg); border: 1.5px dashed var(--c6bd); }

.leg-divider {
  height: 1px; background: var(--border); margin: 4px 0;
}

/* ══ DIAGRAM SCROLL ══ */
.diagram-scroll {
  flex: 1;
  overflow: auto;
  padding: 0;
}
/* sizing shell — JS sets explicit width/height after every zoom so
   the scroll container can reach every pixel in all directions */
.diagram-sizer {
  display: inline-block;
  padding: 2.5rem 3rem 5rem;
}
.diagram-inner {
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  transform-origin: top left;
  transition: transform .2s;
  min-width: max-content;
}

/* ══ TOP-LEVEL KITCHENS ROW ══ */
.kitchens-row {
  display: flex;
  align-items: flex-start;
  justify-content: center;
  gap: 48px;
  min-width: max-content;
}

.kitchen-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
}

/* buttons that float ABOVE a root node */
.root-actions {
  display: flex;
  gap: 5px;
  margin-bottom: 6px;
}
.root-action-btn {
  padding: .28rem .65rem;
  border-radius: 3px;
  font-family: var(--font-m);
  font-size: .62rem;
  font-weight: 600;
  cursor: pointer;
  border: 1.5px solid;
  transition: all .15s;
  white-space: nowrap;
}
.root-action-btn.add-kitchen {
  background: var(--add-btn); color: #111; border-color: var(--add-btn);
}
.root-action-btn.add-kitchen:hover { background: #ffc02e; }
.root-action-btn.del-kitchen {
  background: transparent; color: var(--del-btn); border-color: var(--del-btn);
}
.root-action-btn.del-kitchen:hover { background: var(--del-btn); color: #fff; }

/* add-new-kitchen standalone button */
.add-kitchen-standalone {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  margin-top: 6px;
}
.add-kitchen-dashed {
  padding: .55rem 1.1rem;
  background: transparent;
  border: 2px dashed var(--add-btn);
  color: var(--add-btn);
  border-radius: 4px;
  font-family: var(--font-m);
  font-size: .72rem;
  font-weight: 600;
  cursor: pointer;
  transition: background .15s;
  white-space: nowrap;
}
.add-kitchen-dashed:hover { background: rgba(240,165,0,.1); }

/* ══ TREE STRUCTURE ══ */
.node-col {
  display: flex;
  flex-direction: column;
  align-items: center;
}
.children-row {
  display: flex;
  align-items: flex-start;
  justify-content: center;
  position: relative;
}
.children-row::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: var(--lw);
  background: var(--line);
}
.child-slot {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin: 0 8px;
}
.vline { width: var(--lw); background: var(--line); }

/* ══ NODE BOX ══ */
.node-box {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  border-radius: var(--r);
  padding: .55rem .9rem;
  min-width: 100px; max-width: 180px;
  word-break: break-word;
  transition: filter .15s, transform .12s;
  cursor: default; user-select: none;
}
.node-box:hover { filter: brightness(1.07); }

/* hover controls */
.node-controls {
  position: absolute;
  top: -30px; left: 50%;
  transform: translateX(-50%);
  display: none; gap: 3px;
  background: #1c1a17ee;
  border-radius: 4px;
  padding: 4px 5px;
  white-space: nowrap;
  z-index: 50;
  box-shadow: 0 2px 8px rgba(0,0,0,.4);
}
.node-box:hover .node-controls { display: flex; }

.nc-btn {
  width: 22px; height: 22px;
  border-radius: 3px; border: none;
  font-size: .7rem; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-weight: 700; transition: filter .15s; line-height: 1;
}
.nc-add  { background: var(--add-btn); color: #111; }
.nc-edit { background: var(--edit-btn); color: #fff; }
.nc-del  { background: var(--del-btn); color: #fff; }
.nc-btn:hover { filter: brightness(1.25); }

/* add sub-node dashed button */
.add-below-btn {
  margin-top: 6px;
  padding: .28rem .7rem;
  background: transparent;
  border: 1.5px dashed var(--add-btn);
  color: var(--add-btn);
  border-radius: 3px;
  font-family: var(--font-m); font-size: .6rem;
  cursor: pointer; transition: background .15s; white-space: nowrap;
}
.add-below-btn:hover { background: rgba(240,165,0,.12); }

/* ══ LEVEL COLOUR CLASSES ══ */
.lvl-0 {
  background: var(--c0); color: var(--c0f);
  font-family: var(--font-h); font-size: 1.2rem; font-weight: 800;
  letter-spacing: .1em; text-transform: uppercase;
  min-width: 240px; padding: .85rem 2rem;
}
.lvl-1 {
  background: var(--c1); color: var(--c1f);
  font-family: var(--font-h); font-size: .9rem; font-weight: 700;
  letter-spacing: .05em; text-transform: uppercase; min-width: 145px;
}
.lvl-2 {
  background: var(--c2); color: var(--c2f);
  font-family: var(--font-h); font-size: .82rem; font-weight: 600; min-width: 120px;
}
.lvl-3.color-d { background: var(--c3d); color: var(--c3df); font-family: var(--font-h); font-size: .82rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
.lvl-3.color-c { background: var(--c3c); color: var(--c3cf); font-family: var(--font-h); font-size: .82rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
.lvl-3.color-z { background: var(--c3z); color: var(--c3zf); font-family: var(--font-h); font-size: .82rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
.lvl-3.color-default { background: var(--c3x); color: var(--c3xf); font-family: var(--font-h); font-size: .82rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; }
.lvl-4 { background: var(--c4bg); border: 1.5px solid var(--c4bd); color: var(--c4f); font-size: .72rem; box-shadow: 0 1px 4px var(--shadow); }
.lvl-5 { background: var(--c5bg); border: 1px solid var(--c5bd); color: var(--c5f); font-size: .65rem; box-shadow: 0 1px 3px var(--shadow); }
.lvl-6 { background: var(--c6bg); border: 1px dashed var(--c6bd); color: var(--c6f); font-size: .62rem; }
.lvl-deep { background: #f8f8f8; border: 1px dashed #bbb; color: #555; font-size: .6rem; }

/* ══ MODAL ══ */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.6); z-index: 500;
  display: flex; align-items: center; justify-content: center;
  animation: mFade .15s ease;
}
@keyframes mFade { from{opacity:0}to{opacity:1} }
.modal {
  background: #1e1c19; border: 1.5px solid #3a3830;
  border-radius: 8px; padding: 1.8rem 2.2rem;
  width: min(440px, 94vw); color: #f2ede6;
  box-shadow: 0 20px 60px rgba(0,0,0,.5);
  animation: mSlide .18s ease;
}
@keyframes mSlide { from{transform:translateY(12px);opacity:0}to{transform:translateY(0);opacity:1} }
.modal h2 {
  font-family: var(--font-h); font-size: 1.1rem; font-weight: 700;
  letter-spacing: .07em; color: var(--add-btn);
  margin-bottom: 1.2rem; text-transform: uppercase;
}
.modal label {
  display: block; font-size: .62rem; letter-spacing: .12em;
  text-transform: uppercase; color: #777;
  margin-bottom: .3rem; margin-top: .1rem;
}
.modal input, .modal select {
  width: 100%; background: #2a2825; border: 1px solid #3a3830;
  border-radius: 3px; color: #f2ede6;
  font-family: var(--font-m); font-size: .8rem;
  padding: .5rem .7rem; outline: none;
  margin-bottom: .85rem; transition: border-color .2s;
}
.modal input:focus, .modal select:focus { border-color: var(--add-btn); }
.modal-actions { display: flex; gap: .6rem; justify-content: flex-end; margin-top: .2rem; flex-wrap: wrap; }
.m-btn {
  padding: .45rem 1.1rem; border-radius: 3px;
  font-family: var(--font-m); font-size: .74rem;
  cursor: pointer; border: 1.5px solid; transition: all .15s;
}
.m-confirm { background: var(--add-btn); color: #111; border-color: var(--add-btn); }
.m-confirm:hover { background: #ffc02e; }
.m-cancel { background: transparent; color: #888; border-color: #444; }
.m-cancel:hover { color: #fff; border-color: #888; }
.m-delete { background: transparent; color: var(--del-btn); border-color: var(--del-btn); margin-right: auto; }
.m-delete:hover { background: var(--del-btn); color: #fff; }
</style>
</head>
<body>

<!-- ══ TOPBAR ══ -->
<div class="topbar">
  <h1>🍽 Central Kitchen</h1>
  <div class="topbar-right">
    <div class="zoom-group">
      <button class="tb-btn" onclick="zoomIn()">＋</button>
      <button class="tb-btn" onclick="zoomOut()">－</button>
      <button class="tb-btn" onclick="zoomReset()" title="Reset zoom">⊙</button>
    </div>
    <button class="tb-btn accent" onclick="addFacility()">＋ Add Facility</button>
    <button class="tb-btn" onclick="exportJSON()">⬇ Export JSON</button>
  </div>
</div>

<!-- ══ HINTBAR ══ -->
<div class="hintbar">
  <div class="hint-item"><div class="hint-dot" style="background:var(--add-btn)"></div> Hover any node → <strong style="color:var(--ink)">＋ Add</strong>&nbsp;|&nbsp;<strong style="color:var(--ink)">✎ Edit</strong>&nbsp;|&nbsp;<strong style="color:var(--ink)">✕ Delete</strong></div>
  <div class="hint-item"><div class="hint-dot" style="background:#3a8fd9"></div> Or use the dashed <strong style="color:var(--ink)">＋ Add sub-node</strong> button below each node</div>
</div>

<!-- ══ MAIN ══ -->
<div class="main-wrap">

  <!-- LEFT LEGEND -->
  <aside class="legend-panel">
    <h3>Legend</h3>

    <div class="leg-item">
      <div class="leg-swatch sw-0"></div>
      <span>Central Kitchen</span>
    </div>
    <div class="leg-divider"></div>
    <div class="leg-item">
      <div class="leg-swatch sw-1"></div>
      <span>Facility</span>
    </div>
    <div class="leg-divider"></div>
    <div class="leg-item">
      <div class="leg-swatch sw-2"></div>
      <span>Division</span>
    </div>
    <div class="leg-divider"></div>
    <div class="leg-item">
      <div class="leg-swatch sw-3z"></div>
      <span>Section</span>
    </div>
    <div class="leg-divider"></div>
    <div class="leg-item">
      <div class="leg-swatch sw-4"></div>
      <span>Sub-section</span>
    </div>
    <div class="leg-divider"></div>
    <div class="leg-item">
      <div class="leg-swatch sw-5"></div>
      <span>Unit</span>
    </div>
    <div class="leg-divider"></div>
    <div class="leg-item">
      <div class="leg-swatch sw-6"></div>
      <span>Deep node</span>
    </div>
  </aside>

  <!-- DIAGRAM -->
  <div class="diagram-scroll" id="diagram-scroll">
    <div class="diagram-sizer" id="diagram-sizer">
      <div class="diagram-inner" id="diagram-inner">
        <div id="tree-mount"></div>
      </div>
    </div>
  </div>

</div><!-- /main-wrap -->

<script>

/* ══════════════════════════════════════════
   HELPERS — operate on any tree, not global
══════════════════════════════════════════ */
function findNode(id, node) {
  if (node.id===id) return node;
  for (const c of node.children) { const f=findNode(id,c); if(f) return f; }
  return null;
}
function findNodeAny(id) {
  for (const k of KITCHENS) { const f=findNode(id,k); if(f) return f; }
  return null;
}
function findParentAny(id, node=null, par=null) {
  if (node) {
    if (node.id===id) return par;
    for (const c of node.children) { const f=findParentAny(id,c,node); if(f) return f; }
    return null;
  }
  for (const k of KITCHENS) { const f=findParentAny(id,k,null); if(f) return f; }
  return null;
}
function nodeDepthIn(id, node, d=0) {
  if (node.id===id) return d;
  for (const c of node.children) { const f=nodeDepthIn(id,c,d+1); if(f!==-1) return f; }
  return -1;
}
function nodeDepthAny(id) {
  for (const k of KITCHENS) { const d=nodeDepthIn(id,k,0); if(d!==-1) return d; }
  return -1;
}
function countDesc(node) {
  let n=node.children.length;
  for(const c of node.children) n+=countDesc(c);
  return n;
}

/* ══════════════════════════════════════════
   LEVEL → CSS CLASS
══════════════════════════════════════════ */
function lvlClass(d, color) {
  if (d===0) return 'lvl-0';
  if (d===1) return 'lvl-1';
  if (d===2) return 'lvl-2';
  if (d===3) return 'lvl-3 color-'+(color||'default');
  if (d===4) return 'lvl-4';
  if (d===5) return 'lvl-5';
  if (d===6) return 'lvl-6';
  return 'lvl-deep';
}

/* ══════════════════════════════════════════
   RENDER
══════════════════════════════════════════ */
function render() {
  const mount = document.getElementById('tree-mount');
  mount.innerHTML = '';

  const row = document.createElement('div');
  row.className = 'kitchens-row';

  KITCHENS.forEach((kitchen, idx) => {
    const wrap = document.createElement('div');
    wrap.className = 'kitchen-wrap';

    /* ── above-root action buttons ── */
    const actions = document.createElement('div');
    actions.className = 'root-actions';

    const addBtn = document.createElement('button');
    addBtn.className = 'root-action-btn add-kitchen';
    addBtn.textContent = '＋ Add Kitchen';
    addBtn.onclick = () => addKitchen(idx);
    actions.appendChild(addBtn);

    /* Only show delete if there's more than one kitchen */
    if (KITCHENS.length > 1) {
      const delBtn = document.createElement('button');
      delBtn.className = 'root-action-btn del-kitchen';
      delBtn.textContent = '✕ Delete';
      delBtn.onclick = () => deleteKitchen(idx);
      actions.appendChild(delBtn);
    }

    wrap.appendChild(actions);
    wrap.appendChild(buildNode(kitchen, 0));
    row.appendChild(wrap);
  });

  mount.appendChild(row);
  updateSizer();
}

function buildNode(node, d) {
  const col = document.createElement('div');
  col.className = 'node-col';
  col.dataset.nid = node.id;

  const box = document.createElement('div');
  box.className = 'node-box ' + lvlClass(d, node.color);
  box.dataset.nid = node.id;

  /* hover controls — root nodes only get ＋ and ✎ (delete handled by above-root buttons) */
  const ctrl = document.createElement('div');
  ctrl.className = 'node-controls';
  ctrl.appendChild(ncBtn('＋','nc-add',  'Add child node',  ()=>openAddModal(node.id)));
  ctrl.appendChild(ncBtn('✎','nc-edit', 'Edit this node',   ()=>openEditModal(node.id)));
  if (d > 0) {
    ctrl.appendChild(ncBtn('✕','nc-del','Delete this node', ()=>doDelete(node.id)));
  }
  box.appendChild(ctrl);

  const lbl = document.createElement('span');
  lbl.style.cssText = 'display:block;line-height:1.25;pointer-events:none;';
  lbl.textContent = node.label;
  box.appendChild(lbl);
  if (node.sublabel) {
    const sub = document.createElement('span');
    sub.style.cssText = 'display:block;font-size:.65em;opacity:.65;margin-top:2px;pointer-events:none;';
    sub.textContent = node.sublabel;
    box.appendChild(sub);
  }
  col.appendChild(box);

  if (node.children.length > 0) {
    col.appendChild(vline(24));
    const crow = document.createElement('div');
    crow.className = 'children-row';
    node.children.forEach(child => {
      const slot = document.createElement('div');
      slot.className = 'child-slot';
      slot.appendChild(vline(24));
      slot.appendChild(buildNode(child, d+1));
      crow.appendChild(slot);
    });
    col.appendChild(crow);
  }

  const addBelowBtn = document.createElement('button');
  addBelowBtn.className = 'add-below-btn';
  addBelowBtn.textContent = d===0 ? '＋ Add Facility' : '＋ Add sub-node';
  addBelowBtn.onclick = () => openAddModal(node.id);
  col.appendChild(addBelowBtn);

  return col;
}

function vline(h) {
  const v = document.createElement('div');
  v.className = 'vline'; v.style.height = h+'px';
  return v;
}
function ncBtn(text, cls, title, fn) {
  const b = document.createElement('button');
  b.className = 'nc-btn '+cls; b.textContent = text; b.title = title;
  b.onclick = e => { e.stopPropagation(); fn(); };
  return b;
}

/* ══════════════════════════════════════════
   ZOOM — fix: resize the sizer div so the
   scroll container can reach all content
══════════════════════════════════════════ */
let scale = 1;
function zoomIn()    { scale=Math.min(2.5,scale+.1); applyZoom(); }
function zoomOut()   { scale=Math.max(0.25,scale-.1); applyZoom(); }
function zoomReset() { scale=1; applyZoom(); }
function applyZoom() {
  const inner = document.getElementById('diagram-inner');
  inner.style.transform = `scale(${scale})`;
  updateSizer();
}
function updateSizer() {
  /* Run after a paint so getBoundingClientRect reflects current DOM */
  requestAnimationFrame(() => {
    const inner  = document.getElementById('diagram-inner');
    const sizer  = document.getElementById('diagram-sizer');
    /* natural (pre-scale) size */
    const natW = inner.scrollWidth;
    const natH = inner.scrollHeight;
    /* scaled painted size + padding already on sizer */
    const pad = 80; /* 2.5rem top + 5rem bottom roughly */
    sizer.style.width  = (natW * scale + pad) + 'px';
    sizer.style.height = (natH * scale + pad) + 'px';
  });
}

/* ══════════════════════════════════════════
   KITCHEN-LEVEL ADD / DELETE
══════════════════════════════════════════ */
function addKitchen(afterIdx) {
  if (activeOverlay) { activeOverlay.remove(); activeOverlay=null; }
  const ov = document.createElement('div');
  ov.className = 'modal-overlay';
  ov.innerHTML = `
    <div class="modal">
      <h2>＋ Add Brand Kitchen</h2>
      <label>Kitchen Name *</label>
      <input id="m-label" type="text" placeholder="e.g. Brand Kitchen – North" />
      <label>Sub-label <span style="color:#555">(optional)</span></label>
      <input id="m-sub" type="text" placeholder="e.g. Hub 2" />
      <div class="modal-actions">
        <button class="m-btn m-cancel" id="m-cancel">Cancel</button>
        <button class="m-btn m-confirm" id="m-confirm">Add Kitchen</button>
      </div>
    </div>`;
  document.body.appendChild(ov);
  activeOverlay = ov;
  setTimeout(()=>{ const i=ov.querySelector('input'); if(i) i.focus(); }, 60);
  ov.querySelector('#m-confirm').onclick = () => {
    const label = (document.getElementById('m-label').value||'').trim();
    if (!label) { alert('Kitchen name is required.'); return; }
    const sublabel = (document.getElementById('m-sub').value||'').trim();
    const newKitchen = { id: uid(), label, sublabel, color:'', children:[] };
    KITCHENS.splice(afterIdx + 1, 0, newKitchen);
    ov.remove(); activeOverlay=null;
    render();
  };
  ov.querySelector('#m-cancel').onclick = () => { ov.remove(); activeOverlay=null; };
  ov.addEventListener('click', e => { if(e.target===ov){ ov.remove(); activeOverlay=null; } });
}

function deleteKitchen(idx) {
  if (activeOverlay) { activeOverlay.remove(); activeOverlay=null; }
  const kitchen = KITCHENS[idx];
  const desc = countDesc(kitchen);
  const warning = desc > 0
    ? `<p style="color:#f88;font-size:.75rem;margin-bottom:.9rem;">&#9888; This will also delete all ${desc} nodes inside it.</p>`
    : '';
  const ov = document.createElement('div');
  ov.className = 'modal-overlay';
  ov.innerHTML = `
    <div class="modal">
      <h2 style="color:var(--del-btn);">&#x2715; Delete Kitchen</h2>
      <p style="font-size:.8rem;margin-bottom:.7rem;color:#ccc;">
        Delete <strong style="color:#fff;">"${escHtml(kitchen.label)}"</strong> entirely?
      </p>
      ${warning}
      <div class="modal-actions">
        <button class="m-btn m-cancel" id="m-cancel">Cancel</button>
        <button class="m-btn" id="m-confirm-del"
          style="background:var(--del-btn);color:#fff;border-color:var(--del-btn);">Delete Kitchen</button>
      </div>
    </div>`;
  document.body.appendChild(ov);
  activeOverlay = ov;
  ov.querySelector('#m-confirm-del').onclick = () => {
    ov.remove(); activeOverlay=null;
    KITCHENS.splice(idx, 1);
    render();
  };
  ov.querySelector('#m-cancel').onclick = () => { ov.remove(); activeOverlay=null; };
  ov.addEventListener('click', e => { if(e.target===ov){ ov.remove(); activeOverlay=null; } });
}

/* ══════════════════════════════════════════
   MODAL SYSTEM (for node-level edits)
══════════════════════════════════════════ */
let activeOverlay = null;

function showModal(bodyHTML, onConfirm, onDelete) {
  if (activeOverlay) { activeOverlay.remove(); activeOverlay=null; }
  const ov = document.createElement('div');
  ov.className = 'modal-overlay';
  ov.innerHTML = `<div class="modal">${bodyHTML}</div>`;
  document.body.appendChild(ov);
  activeOverlay = ov;
  ov.querySelector('#m-confirm').onclick = () => { onConfirm(); ov.remove(); activeOverlay=null; };
  ov.querySelector('#m-cancel').onclick  = () => { ov.remove(); activeOverlay=null; };
  if (onDelete) {
    const db = ov.querySelector('#m-delete');
    if (db) db.onclick = () => { ov.remove(); activeOverlay=null; onDelete(); };
  }
  ov.addEventListener('click', e => { if(e.target===ov){ ov.remove(); activeOverlay=null; } });
  setTimeout(()=>{ const i=ov.querySelector('input'); if(i) i.focus(); }, 60);
}

function colorOptions(current) {
  return [
    ['default','Default (dark grey)'],
    ['d','Section Blue'],
    ['c','Section Blue'],
    ['z','Section Blue']
  ].map(([v,t],i,arr)=> i>0 && arr.findIndex(x=>x[0]===v)!==i ? '' :
    `<option value="${v}" ${current===v?'selected':''}>${t}</option>`
  ).join('');
}

/* ══════════════════════════════════════════
   ADD NODE MODAL
══════════════════════════════════════════ */
function openAddModal(parentId) {
  const parent = findNodeAny(parentId);
  const childDepth = nodeDepthAny(parentId) + 1;
  const colorHtml = childDepth===3 ? `
    <label>Section Colour</label>
    <select id="m-color">
      <option value="default">Default (dark grey)</option>
      <option value="z" selected>Section Blue</option>
    </select>` : '';

  showModal(`
    <h2>＋ Add node under "${escHtml(parent.label)}"</h2>
    <label>Label *</label>
    <input id="m-label" type="text" placeholder="Node name" />
    <label>Sub-label <span style="color:#555">(optional)</span></label>
    <input id="m-sub" type="text" placeholder="e.g. Facility, Division…" />
    ${colorHtml}
    <div class="modal-actions">
      <button class="m-btn m-cancel" id="m-cancel">Cancel</button>
      <button class="m-btn m-confirm" id="m-confirm">Add Node</button>
    </div>`, () => {
    const label = (document.getElementById('m-label').value||'').trim();
    if (!label) { alert('A label is required.'); return; }
    const sublabel = (document.getElementById('m-sub').value||'').trim();
    const colorEl  = document.getElementById('m-color');
    const color    = colorEl ? colorEl.value : '';
    parent.children.push({ id:uid(), label, sublabel, color, children:[] });
    render();
  });
}

/* ══════════════════════════════════════════
   EDIT NODE MODAL
══════════════════════════════════════════ */
function openEditModal(id) {
  const node    = findNodeAny(id);
  const d       = nodeDepthAny(id);
  const isRoot  = KITCHENS.some(k => k.id === id);
  const colorHtml = d===3 ? `
    <label>Section Colour</label>
    <select id="m-color">
      <option value="default" ${(!node.color||node.color==='default')?'selected':''}>Default (dark grey)</option>
      <option value="z" ${node.color&&node.color!=='default'?'selected':''}>Section Blue</option>
    </select>` : '';
  const deleteBtn = isRoot ? '' : '<button class="m-btn m-delete" id="m-delete">Delete</button>';

  showModal(`
    <h2>✎ Edit "${escHtml(node.label)}"</h2>
    <label>Label *</label>
    <input id="m-label" type="text" value="${escHtml(node.label)}" />
    <label>Sub-label</label>
    <input id="m-sub" type="text" value="${escHtml(node.sublabel||'')}" />
    ${colorHtml}
    <div class="modal-actions">
      ${deleteBtn}
      <button class="m-btn m-cancel" id="m-cancel">Cancel</button>
      <button class="m-btn m-confirm" id="m-confirm">Save</button>
    </div>`, () => {
    const label = (document.getElementById('m-label').value||'').trim();
    if (!label) { alert('A label is required.'); return; }
    node.label    = label;
    node.sublabel = (document.getElementById('m-sub').value||'').trim();
    const colorEl = document.getElementById('m-color');
    if (colorEl) node.color = colorEl.value;
    render();
  }, isRoot ? null : () => doDelete(id));
}

/* ══════════════════════════════════════════
   DELETE NODE (within a kitchen)
══════════════════════════════════════════ */
function doDelete(id) {
  if (activeOverlay) { activeOverlay.remove(); activeOverlay=null; }
  const node = findNodeAny(id);
  if (!node) return;
  const desc = countDesc(node);
  const warning = desc > 0
    ? `<p style="color:#f88;font-size:.75rem;margin-bottom:.9rem;">&#9888; This will also delete ${desc} child node(s) inside it.</p>`
    : '';
  const ov = document.createElement('div');
  ov.className = 'modal-overlay';
  ov.innerHTML = `
    <div class="modal">
      <h2 style="color:var(--del-btn);">&#x2715; Delete Node</h2>
      <p style="font-size:.8rem;margin-bottom:.7rem;color:#ccc;">
        Delete <strong style="color:#fff;">"${escHtml(node.label)}"</strong>?
      </p>
      ${warning}
      <div class="modal-actions">
        <button class="m-btn m-cancel" id="m-cancel">Cancel</button>
        <button class="m-btn" id="m-confirm-del"
          style="background:var(--del-btn);color:#fff;border-color:var(--del-btn);">Delete</button>
      </div>
    </div>`;
  document.body.appendChild(ov);
  activeOverlay = ov;
  ov.querySelector('#m-confirm-del').onclick = () => {
    ov.remove(); activeOverlay=null;
    const par = findParentAny(id);
    if (!par) return;
    par.children = par.children.filter(c=>c.id!==id);
    render();
  };
  ov.querySelector('#m-cancel').onclick = () => { ov.remove(); activeOverlay=null; };
  ov.addEventListener('click', e => { if(e.target===ov){ ov.remove(); activeOverlay=null; } });
}

/* ══════════════════════════════════════════
   TOPBAR SHORTCUT
══════════════════════════════════════════ */
function addFacility() { openAddModal(KITCHENS[0].id); }

/* ══════════════════════════════════════════

══════════════════════════════════════════ */
function exportJSON() {
  const blob = new Blob([JSON.stringify(KITCHENS,null,2)],{type:'application/json'});
  const a = document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download='central_kitchen.json'; a.click();
}

/* ══════════════════════════════════════════
   UTILS
══════════════════════════════════════════ */
function escHtml(s='') {
  return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
